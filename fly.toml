# Fly.io config for the multiplayer server.
#
# Deploy with:
#   fly launch --no-deploy    # once, to claim an app name (it will edit `app` below)
#   fly deploy
#
# Then point the game at wss://<app>.fly.dev — note wss, not ws: Fly terminates
# TLS, and a browser on an HTTPS page refuses a plaintext WebSocket.

app = "cut-and-collect"   # <- must be globally unique; `fly launch` will rewrite this
primary_region = "iad"    # <- pick one near your players: `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true

  # Rooms live in memory, so a machine stopping means every game on it is gone.
  # Keeping one always-on avoids both that and a cold start on the first player.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # A WebSocket connection is long-lived and mostly idle between plays; the
  # default concurrency limits are tuned for short HTTP requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  # Hits the plain-HTTP endpoint the server exposes alongside the socket.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
